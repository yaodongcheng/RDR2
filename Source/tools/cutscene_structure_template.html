<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>RDR2 过场结构浏览器</title>
<style>
:root{--bg:#0d1015;--panel:#151a22;--panel2:#1b222c;--line:#28313d;--fg:#e2e9f2;--mut:#8d9aab;--hl:#e0b356;--cine:#3fb6a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.6 "Microsoft YaHei",system-ui,sans-serif}
header{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;letter-spacing:.3px}
input[type=search],select{background:#0f141a;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
input[type=search]{width:240px}
.wrap{display:grid;grid-template-columns:minmax(360px,38%) 1fr;gap:12px;padding:12px 18px 30px;align-items:start}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.panel h2{margin:0;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line);color:#c7d2df;display:flex;justify-content:space-between}
.panel h2 span{color:var(--mut);font-weight:400;font-size:12px}
.list{max-height:calc(100vh - 150px);overflow:auto}
.item{padding:7px 12px;border-bottom:1px solid #1c232d;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px}
.item:hover{background:#1a2230}
.item.on{background:#22304a;box-shadow:inset 3px 0 0 var(--hl)}
.item .cid{font-weight:600}
.item .sub{color:var(--mut);font-size:11.5px;grid-column:1/3}
.tag{display:inline-block;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut);font-size:11px;margin-left:5px}
.tag.cam{color:var(--cine);border-color:#2b6b64}
.tag.cap{color:#e08b4a;border-color:#6b4a2b}
.sec{padding:12px 14px;border-bottom:1px solid #1c232d}
.sec h3{margin:0 0 8px;font-size:13px;color:#c7d2df}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid #1c232d;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;background:#243041;border-radius:4px;padding:0 6px;margin:1px 3px 1px 0;font-size:11.5px;color:#b9c8d9}
.note{color:var(--mut);font-size:12px;line-height:1.7}
.kv{color:var(--mut);font-size:12.5px;margin:2px 0}
.kv b{color:var(--fg)}
</style></head><body>
<header>
  <h1>过场结构浏览器 · 653 个过场</h1>
  <input type="search" id="q" placeholder="搜过场 ID / 任务 / 演员…">
  <select id="fm"><option value="">全部任务</option></select>
  <span class="note" id="cnt"></span>
</header>
<div class="wrap">
  <div class="panel"><h2>过场列表 <span id="ln"></span></h2><div class="list" id="list"></div></div>
  <div class="panel"><h2>详情 <span id="dn"></span></h2><div id="detail"></div></div>
</div>
<script>
const DATA = /*__DATA__*/;
const scenes = DATA.scenes;
const listEl = document.getElementById('list');
const fm = document.getElementById('fm');
[...new Set(scenes.map(s=>s.mission))].sort().forEach(m=>{
  const o=document.createElement('option'); o.value=m; o.textContent=m; fm.appendChild(o);
});
let cur = 0;
function fmt(t){ return t==null?'—':t.toFixed(2)+'s'; }
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const m=fm.value;
  const out=scenes.filter(s=>{
    if(m && s.mission!==m) return false;
    if(!q) return true;
    return [s.cutscene,s.mission,...(s.actors||[])].join(' ').toLowerCase().includes(q);
  });
  document.getElementById('cnt').textContent = out.length+' / '+scenes.length;
  document.getElementById('ln').textContent = out.length+' 个';
  listEl.innerHTML = out.map((s,i)=>{
    const idx=scenes.indexOf(s);
    return `<div class="item ${idx===cur?'on':''}" data-i="${idx}">
      <div class="cid">${s.cutscene}${s.cam?'<span class="tag cam">相机</span>':''}${s.capped?'<span class="tag cap">时长截断</span>':''}</div>
      <div class="num" style="color:#8d9aab">${fmt(s.duration)}</div>
      <div class="sub">${s.mission} · ${s.shots} 镜 · ${s.clips} clip · ${s.n_actors} 演员 · 相机 clip ${s.camera_clips}</div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.item').forEach(el=>el.onclick=()=>{cur=+el.dataset.i; render();});
  renderDetail(scenes[cur]);
}
function renderDetail(s){
  if(!s) return;
  document.getElementById('dn').textContent = s.cutscene;
  let h = `<div class="sec">
    <div class="kv"><b>${s.cutscene}</b> · ${s.mission} · ${s.pack}</div>
    <div class="kv">时长 <b>${fmt(s.duration)}</b>${s.capped?'（卡在 16 s 分页上限，实际更长）':''}
      · 镜头 <b>${s.shots}</b> · clip <b>${s.clips}</b> · 演员 <b>${s.n_actors}</b>
      · 相机 clip <b>${s.camera_clips}</b></div>
    <div class="kv">段 parts: ${(s.parts||[]).join(', ')||'—'} · 条 takes: ${(s.takes||[]).join(', ')||'—'}</div>
  </div>`;
  if(s.cam){
    h += `<div class="sec"><h3>相机轨迹（跨页拼接）</h3>
      <div class="kv">轨迹时长 <b>${fmt(s.cam.duration)}</b> · 段数 <b>${s.cam.n}</b></div>
      <table><tr><th>#</th><th>起</th><th>时长</th><th>位置(x,y)</th><th>位移</th></tr>` +
      s.cam.segs.map((g,i)=>`<tr><td>${i}</td><td class="num">${fmt(g.t0)}</td><td class="num">${fmt(g.dur)}</td>
        <td class="num">${g.pos?g.pos.join(', '):'—'}</td>
        <td class="num">${g.move<0.05?'固定':g.move.toFixed(2)+' m'}</td></tr>`).join('') +
      `</table></div>`;
  }
  h += `<div class="sec"><h3>分镜槽（按 shot 编号归并演员）</h3><table>
    <tr><th>shot</th><th>相机</th><th>演员</th></tr>` +
    s.groups.map(g=>`<tr><td class="num">${g.shot}</td><td>${g.camera?'✓':''}</td>
      <td>${g.actors.map(a=>`<span class="chip">${a}</span>`).join('')}${g.n>g.actors.length?' …':''}</td></tr>`).join('') +
    `</table></div>`;
  h += `<div class="sec"><h3>全部演员（${s.n_actors}）</h3><div>${(s.actors||[]).map(a=>`<span class="chip">${a}</span>`).join('')}</div></div>`;
  document.getElementById('detail').innerHTML = h;
}
document.getElementById('q').addEventListener('input',render);
fm.addEventListener('change',render);
render();
</script></body></html>
